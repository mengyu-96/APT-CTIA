version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: apt_attribution_backend
    ports:
      - "5001:5001"
    volumes:
      - ./dataset_TXT:/app/dataset_TXT
      - ./results_archive:/app/results_archive
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: apt_attribution_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:5001
    depends_on:
      - backend
    restart: unless-stopped
