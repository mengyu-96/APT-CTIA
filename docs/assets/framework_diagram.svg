<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780">
  <rect width="1400" height="780" fill="#ffffff" />

  <defs>
    <linearGradient id="bgSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0b1f33" flood-opacity="0.15" />
    </filter>

    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10.5" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#2d3436" />
    </marker>

    <marker id="arrowBlue" markerWidth="14" markerHeight="12" refX="12.5" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 Z" fill="#2f6fed" />
    </marker>

    <pattern id="dotGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#d7e6ff" />
    </pattern>

    <symbol id="icoDoc" viewBox="0 0 64 64">
      <path d="M14 6h26l10 10v42H14z" fill="#e9f2ff" stroke="#2f6fed" stroke-width="3" />
      <path d="M40 6v12h12" fill="none" stroke="#2f6fed" stroke-width="3" />
      <path d="M20 26h24M20 34h24M20 42h18" stroke="#2f6fed" stroke-width="3" stroke-linecap="round" />
    </symbol>

    <symbol id="icoPdfTxt" viewBox="0 0 64 64">
      <rect x="10" y="6" width="44" height="52" rx="6" fill="#fff5f5" stroke="#ff5b5b" stroke-width="3" />
      <path d="M18 22h28M18 30h28M18 38h18" stroke="#ff5b5b" stroke-width="3" stroke-linecap="round" />
      <circle cx="46" cy="46" r="8" fill="#ff5b5b" />
      <path d="M42 46h8" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    </symbol>

    <symbol id="icoUpload" viewBox="0 0 64 64">
      <rect x="10" y="12" width="44" height="40" rx="8" fill="#f0fffa" stroke="#14b8a6" stroke-width="3" />
      <path d="M32 44V24" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" />
      <path d="M24 30l8-8 8 8" fill="none" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M20 50h24" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" />
    </symbol>

    <symbol id="icoDb" viewBox="0 0 64 64">
