      <path d="M12 14v28c0 4.4 9 8 20 8s20-3.6 20-8V14" fill="#f5fff7" stroke="#22c55e" stroke-width="3" />
      <path d="M12 28c0 4.4 9 8 20 8s20-3.6 20-8" fill="none" stroke="#22c55e" stroke-width="3" />
    </symbol>

    <symbol id="icoGear" viewBox="0 0 64 64">
      <path d="M36.8 6l2.4 6.1 6.6 1.1 3.9-5.2 6.1 6.1-5.2 3.9 1.1 6.6 6.1 2.4v8.6l-6.1 2.4-1.1 6.6 5.2 3.9-6.1 6.1-3.9-5.2-6.6 1.1-2.4 6.1h-8.6l-2.4-6.1-6.6-1.1-3.9 5.2-6.1-6.1 5.2-3.9-1.1-6.6-6.1-2.4v-8.6l6.1-2.4 1.1-6.6-5.2-3.9 6.1-6.1 3.9 5.2 6.6-1.1L27.9 6z" fill="#fff7ed" stroke="#f59e0b" stroke-width="3" />
