      <path d="M390 620H410" stroke="#2d3436" stroke-width="2.4" fill="none" marker-end="url(#arrow)" />
      <path d="M680 620H700" stroke="#2d3436" stroke-width="2.4" fill="none" marker-end="url(#arrow)" />
      <path d="M970 620H990" stroke="#2d3436" stroke-width="2.4" fill="none" marker-end="url(#arrow)" />
