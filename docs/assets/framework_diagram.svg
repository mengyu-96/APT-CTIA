      <path d="M40 8v12h12" fill="none" stroke="#ef4444" stroke-width="3" />
      <path d="M22 28h20M22 36h20" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
      <path d="M22 46h10" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
      <path d="M40 42l5 5" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
      <path d="M45 42l-5 5" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
