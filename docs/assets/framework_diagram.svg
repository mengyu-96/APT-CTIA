        <text x="58" y="36" font-size="14" font-weight="700" fill="#0f172a">原始CTI报告</text>
      </g>

      <g transform="translate(410,185)">
        <use href="#icoUpload" x="0" y="8" width="46" height="46" />
        <text x="58" y="36" font-size="14" font-weight="700" fill="#0f172a">用户上传</text>
      </g>

      <g transform="translate(700,185)">
        <use href="#icoDb" x="0" y="8" width="46" height="46" />
        <text x="58" y="36" font-size="14" font-weight="700" fill="#0f172a">知识与元数据</text>
      </g>

      <g transform="translate(990,185)">
        <use href="#icoDoc" x="0" y="8" width="46" height="46" />
        <text x="58" y="36" font-size="14" font-weight="700" fill="#0f172a">中间产物</text>
      </g>

