      <circle cx="48" cy="18" r="6" fill="#eafff4" stroke="#22c55e" stroke-width="3" />
      <circle cx="32" cy="46" r="7" fill="#eafff4" stroke="#22c55e" stroke-width="3" />
      <path d="M22 20l20 0M20 24l10 16M44 24L34 40" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
