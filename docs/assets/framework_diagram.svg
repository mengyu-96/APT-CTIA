      <path d="M670 218H700" stroke="#2d3436" stroke-width="2.4" fill="none" marker-end="url(#arrow)" />
      <path d="M960 218H990" stroke="#2d3436" stroke-width="2.4" fill="none" marker-end="url(#arrow)" />
    </g>

