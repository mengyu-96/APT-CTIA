        <text x="62" y="42" font-size="14" font-weight="700" fill="#0f172a">文本解析</text>
      </g>

      <g transform="translate(410,355)">
        <use href="#icoDoc" x="0" y="10" width="50" height="50" />
        <text x="62" y="42" font-size="14" font-weight="700" fill="#0f172a">实体提取</text>
      </g>

      <g transform="translate(700,355)">
        <use href="#icoChart" x="0" y="10" width="50" height="50" />
        <text x="62" y="42" font-size="14" font-weight="700" fill="#0f172a">特征融合</text>
      </g>

      <g transform="translate(990,355)">
        <use href="#icoGraph" x="0" y="10" width="50" height="50" />
        <text x="62" y="42" font-size="14" font-weight="700" fill="#0f172a">异构构图</text>
      </g>

      <path d="M390 393H410" stroke="#2d3436" stroke-width="2.4" fill="none" marker-end="url(#arrow)" />
      <path d="M680 393H700" stroke="#2d3436" stroke-width="2.4" fill="none" marker-end="url(#arrow)" />
      <path d="M970 393H990" stroke="#2d3436" stroke-width="2.4" fill="none" marker-end="url(#arrow)" />

      <g transform="translate(120,435)">
        <use href="#icoBrain" x="0" y="4" width="56" height="56" />
        <text x="70" y="39" font-size="14" font-weight="700" fill="#0f172a">GNN 训练与推理</text>
      </g>

      <g transform="translate(710,435)">
        <use href="#icoReport" x="0" y="4" width="56" height="56" />
        <text x="70" y="39" font-size="14" font-weight="700" fill="#0f172a">输出结果与报告</text>
      </g>

      <path d="M680 468H710" stroke="#2d3436" stroke-width="2.4" fill="none" marker-end="url(#arrow)" />
    </g>

    <g>
      <text x="118" y="565" font-size="16" font-weight="700" fill="#b45309">③ 服务与可视化</text>

      <g transform="translate(120,585)">
        <use href="#icoApi" x="0" y="10" width="50" height="50" />
        <text x="62" y="40" font-size="14" font-weight="700" fill="#0f172a">服务接口</text>
      </g>

      <g transform="translate(410,585)">
        <use href="#icoChart" x="0" y="10" width="50" height="50" />
        <text x="62" y="40" font-size="14" font-weight="700" fill="#0f172a">交互界面</text>
      </g>

      <g transform="translate(700,585)">
        <use href="#icoUser" x="0" y="10" width="50" height="50" />
        <text x="62" y="40" font-size="14" font-weight="700" fill="#0f172a">安全分析员</text>
      </g>

      <g transform="translate(990,585)">
        <use href="#icoDocker" x="0" y="12" width="48" height="48" />
        <text x="62" y="40" font-size="13" font-weight="700" fill="#0f172a">部署</text>
